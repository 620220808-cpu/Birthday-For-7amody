<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>For Mo7amed ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Loading -->

<div id="loading">

<h1>For Mo7amed ❤️</h1>

<p>This Journey Is Made Only For You</p>

<div class="loadingBar">

<div class="bar"></div>

</div>

</div>

<!-- Music -->

<audio id="music" loop>
    <source src="musicsong.mp3" type="audio/mpeg">
</audio>
<source src="music/song.mp3" type="audio/mp3">

</audio>

<!-- Hero -->

<section class="hero">

<div class="overlay">

<h3>❤️ Welcome ❤️</h3>

<h1>Mo7amed</h1>

<p>

Every road leads me back to you.

</p>

<button id="start">

🚗 Start Engine

</button>

</div>

</section>

<!-- Road -->

<section id="roadSection">

<div class="sky">

<div class="moon"></div>

<div id="stars"></div>

</div>

<div class="road">

<div class="middleLine"></div>

</div>

<img src="fiat126.png" class="car" id="car">

</section>

<!-- Station 1 -->

<section class="station">

<div class="board">

❤️ اشتقتلك ❤️

</div>

</section>

<!-- Station 2 -->

<section class="station">

<div class="board">

يمكن بعدنا...

</div>

</section>
<!-- Station 3 -->

<section class="station">

    <div class="board">

        لكن قلبي عمره ما بعد ❤️

    </div>

</section>

<!-- Station 4 -->

<section class="station">

    <div class="board">

        كل طريق مشيت فيه...

    </div>

</section>

<!-- Station 5 -->

<section class="station">

    <div class="board">

        كان نفسي تكون معايا.

    </div>

</section>

<!-- Destination -->

<section id="destination">

    <div class="sea"></div>

    <div class="finalBox">

        <img src="images/fiat126.png"
             class="finalCar">

        <h1>

            يمكن الوقت غيّر تفاصيل كتير...

        </h1>

        <h2>

            لكن مكانك في قلبي عمره ما اتغير ❤️

        </h2>

        <p>

            For My Love Mo7amed ❤️

        </p>

        <button id="restart">

            🔄 Restart Journey

        </button>

    </div>

</section>

<!-- Hearts -->

<div id="hearts"></div>

<!-- Javascript -->

<script src="script.js"></script>

</body>

</html>
