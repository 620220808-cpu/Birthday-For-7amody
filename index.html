<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Mo7amed ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- شاشة التحميل -->

<div id="loading">

    <h1>For Mo7amed ❤️</h1>

    <p>Preparing your journey...</p>

    <div class="loadingBar">

        <div class="bar"></div>

    </div>

</div>

<!-- الموسيقى -->

<audio id="music" loop>

    <source src="musicsong.mp3" type="audio/mpeg">

</audio>

<!-- الصفحة الأولى -->

<section class="hero">

    <div class="overlay">

        <h3>❤️ Welcome ❤️</h3>

        <h1>For My Love Mo7amed</h1>

        <p>اضغط على الزر وابدأ الرحلة ❤️</p>

        <button id="start">

            🚗 Start Engine

        </button>

    </div>

</section>

<!-- بداية مشهد الطريق -->

<section id="roadSection">

    <!-- السماء -->

    <div class="sky">

        <div class="moon"></div>

        <div id="stars"></div>

    </div>

    <!-- الطريق -->

    <div class="road">

        <div class="middleLine"></div>

    </div>

    <!-- العربية -->

    <img src="fiat126.png" id="car" class="car">

    <!-- اللافتات -->

    <div id="signs">

        <div class="board">❤️ اشتقتلك ❤️</div>

        <div class="board">كل يوم بفكر فيك</div>

        <div class="board">وجودك فرق معايا كتير</div>

        <div class="board">ربنا يديمك في حياتي ❤️</div>

        <div class="board">وصلنا ❤️</div>

    </div>
        <!-- النهاية -->

    <div id="destination">

        <div class="sea"></div>

        <div class="finalBox">

            <h1>❤️ وصلنا ❤️</h1>

            <h2>
                يمكن الطريق كان طويل...
                لكن وجودك يستاهل أي رحلة ❤️
            </h2>

            <p>
                To My Love <br>
                <strong>Mo7amed ❤️</strong>
            </p>

            <button id="restart">

                🔄 Restart Journey

            </button>

        </div>

    </div>

</section>

<!-- القلوب -->

<div id="hearts"></div>

<script src="script.js"></script>

</body>
</html>
